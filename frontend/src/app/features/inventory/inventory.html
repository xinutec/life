<div class="head">
  <h2>Inventory</h2>
  <div class="toggles">
    <button mat-stroked-button (click)="addPlace()">
      <mat-icon>add</mat-icon> Place
    </button>
  </div>
</div>

<section>
  <h3>Items</h3>
  <app-list-state
    [loading]="!itemsLoaded()"
    [error]="itemsError()"
    [refreshing]="itemsRefreshing()"
    (retry)="reloadItems()"
    [empty]="items().length === 0"
    emptyIcon="inventory_2"
    emptyText="No items yet — tap the + button."
  />
  <mat-list>
    @for (it of items(); track it.id) {
      <mat-list-item lines="2">
        <app-product-thumb matListItemAvatar [barcode]="it.barcode" [productId]="it.product_id" [hasImage]="it.has_image" />
        <span
          matListItemTitle
          class="tappable"
          role="button"
          tabindex="0"
          (click)="editItem(it)"
          (keydown.enter)="editItem(it)"
          (keydown.space)="editItem(it); $event.preventDefault()"
          >{{ it.name }}</span
        >
        <span matListItemLine class="meta-line">
          <span class="facts">
            {{ qty(it) }}
            @if (it.location_id) { · {{ shortLoc(it.location_id) }} }
          </span>
          @if (it.expiry) {
            <span class="expiry" [class]="expiryOf(it).cls">{{ expiryOf(it).label }}</span>
          }
        </span>
        <button
          matListItemMeta
          mat-icon-button
          [matMenuTriggerFor]="itemMenu"
          [matMenuTriggerData]="{ it }"
          [attr.aria-label]="'More actions for ' + it.name"
        >
          <mat-icon>more_vert</mat-icon>
        </button>
      </mat-list-item>
    }
  </mat-list>
</section>

<!-- Same shape as the Buy list's row menu, and for the same reason: Material
     sizes the meta area to its content, so every button here is width taken off
     the name, and item names were arriving as "Milk (…". All three actions live
     in the menu and the row keeps ONE trailing control, which is what /items
     does and what leaves room for the second line to say what it means. -->
<mat-menu #itemMenu>
  <ng-template matMenuContent let-it="it">
    <button mat-menu-item (click)="useItem(it)">
      <mat-icon>remove_circle_outline</mat-icon>
      <span>Record using some</span>
    </button>
    <button mat-menu-item (click)="addToBuy(it)">
      <mat-icon>add_shopping_cart</mat-icon>
      <span>Add to Buy list</span>
    </button>
    <button mat-menu-item (click)="deleteItem(it.id)">
      <mat-icon>delete</mat-icon>
      <span>Delete</span>
    </button>
  </ng-template>
</mat-menu>

<section>
  <h3>Places</h3>
  <app-list-state
    [loading]="!placesLoaded()"
    [error]="placesError()"
    [refreshing]="placesRefreshing()"
    (retry)="reloadLocations()"
    [empty]="locations().length === 0"
    emptyIcon="inventory_2"
    emptyText="No places yet — tap “+ Place”."
  />
  <mat-list>
    @for (loc of locations(); track loc.id) {
      <mat-list-item lines="2">
        <mat-icon matListItemIcon>inventory_2</mat-icon>
        <span matListItemTitle>{{ pathOf(loc.id) }}</span>
        <span matListItemLine>{{ loc.kind }}</span>
        <button matListItemMeta mat-icon-button (click)="deletePlace(loc.id)" aria-label="Delete">
          <mat-icon>delete</mat-icon>
        </button>
      </mat-list-item>
    }
  </mat-list>
</section>

<div class="fab-anchor">
  <button mat-fab class="add-fab" (click)="addItem()" aria-label="Add an item">
    <mat-icon>add</mat-icon>
  </button>
</div>
