<div class="checkin" role="group" aria-label="How do you feel right now?">
  @for (s of scores; track s.score) {
    <button
      type="button"
      class="face score-{{ s.score }}"
      [attr.aria-label]="'Log feeling: ' + s.label"
      [title]="s.label"
      (click)="log(s.score)"
    >
      <mat-icon>{{ s.icon }}</mat-icon>
      <span class="lbl">{{ s.label }}</span>
    </button>
  }
</div>

<!-- Only after a log, and only where the parent can open the entry. Says what
     it adds rather than "Edit": the entry is already saved, and this is
     continuing the thought, not correcting a mistake. -->
@if (showDetail() && justLogged(); as key) {
  <button
    type="button"
    class="add-detail"
    mat-button
    (click)="detail.emit(key)"
  >
    <mat-icon>add</mat-icon>
    Add energy, emotions or a note
  </button>
}
