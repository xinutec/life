# Version catalog for the home web-viewer Android app.
[versions]
agp = "8.13.0"
kotlin = "2.4.0"
coreKtx = "1.16.0"
webkit = "1.14.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
# WebViewCompat.addWebMessageListener — the origin-scoped replacement for
# addJavascriptInterface, which is injected into every frame in the WebView and
# has no origin control at all. See the bridges in MainActivity.
androidx-webkit = { group = "androidx.webkit", name = "webkit", version.ref = "webkit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
