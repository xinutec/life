[package]
name = "life"
version = "0.1.0"
edition = "2024"

# Lints the toolchain leaves at `allow` that this crate wants denied. `-D
# warnings` in scripts/verify.sh then makes each of them a hard failure, so the
# rule is enforced by the build rather than by remembering it at review time.
[lints.rust]
# Nothing here needs it, and a future need should be an argued exception rather
# than a quiet addition.
unsafe_code = "forbid"
# A `pub` item nobody uses is either dead or an unfinished wiring-up; both are
# worth seeing.
unreachable_pub = "warn"

[lints.clippy]
# Debugging leftovers. The app logs through `tracing`; a stray dbg!/println!
# writes past it and is invisible in production.
#
# `print_stderr` is deliberately NOT here: `[lints]` covers every target of the
# package, and the DB-backed tests announce a skip on stderr — which is the
# point of them (verify.sh is built around never skipping silently). Denying it
# would mean 27 waivers to protect `src/`, which contains no prints at all.
dbg_macro = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
# Numeric casts that can silently change a value. Money is integer pence and
# nutrition is f64 from the sources — a truncating `as` in either is a bug that
# nothing else would catch.
cast_possible_truncation = "deny"
cast_precision_loss = "deny"
cast_sign_loss = "deny"
cast_lossless = "warn"
# `==` on floats. Nutrition figures come from two sources and are compared for
# divergence; exact equality there is a trap.
float_cmp = "deny"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower-http = { version = "0.7", features = ["fs", "trace"] }
axum-extra = { version = "0.12", features = ["cookie"] }
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring",
    "mysql",
    "chrono",
    "json",
    "derive",
    "macros",
    "migrate",
] }
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "form",
    "rustls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
hmac = "0.13"
sha2 = "0.11"
hex = "0.4"
base64 = "0.22"
rand = "0.10"
url = "2"
time = "0.3"
ulid = "1"
anyhow = "1"
thiserror = "2"
# Generates the frontend TS interfaces from these Rust types (see scripts/
# gen-types.sh + frontend/src/app/generated/) so the wire shapes can't drift.
ts-rs = { version = "12", features = ["serde-compat", "chrono-impl", "serde-json-impl"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
icalendar = "0.17"
quick-xml = "0.41.0"

[dev-dependencies]
# Router-level tests drive the app via ServiceExt::oneshot (no live socket).
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
