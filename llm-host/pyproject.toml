[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "life-llm-host"
version = "0.0.0"
description = "Holds the emotion worker's LLM in one process and serves it on localhost"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136",
    "mlx-lm>=0.31",
    "uvicorn>=0.49",
]

[dependency-groups]
dev = ["httpx2>=2.13", "pytest>=9.1"]

[tool.uv]
constraint-dependencies = ["mlx<0.32"]
environments = ["sys_platform == 'darwin'"]

[tool.hatch.build.targets.wheel]
packages = ["src/life_llm_host"]
